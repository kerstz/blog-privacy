name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday 06:00 UTC: catches CVEs published since the last push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pytest -q tests/

  dependency-audit:
    name: Dependency CVE scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock
      # --strict: a package that cannot be audited fails the job.
      - run: pip-audit -r requirements.lock --require-hashes --disable-pip --strict --desc on

  static-analysis:
    name: Static security analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: bandit -r app create_admin.py wsgi.py -q

  lint:
    name: Lint (ruff, syntax errors and undefined names only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check --select E9,F63,F7,F82 app tests wsgi.py create_admin.py

  no-javascript:
    name: No JavaScript / no third-party resources in templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check templates
        run: |
          set -e
          if grep -rnE "<script|<style|\son[a-z]+=|javascript:" app/templates/; then
            echo "::error::JavaScript or inline <style> found in templates (strict CSP: no JS, CSS in static files)"; exit 1
          fi
          if grep -rnE "(src|href)=\"https?://" app/templates/ | grep -vE "rel=\"[^\"]*noreferrer"; then
            echo "::error::Third-party resource or link without rel=noreferrer found"; exit 1
          fi
