<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/icons.css') }}">
    <style>
        /* Self-contained admin base (no CDN framework) */
        body { margin: 0; background: #14110d; color: #ece3d2; font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif; }
        .navbar { display: flex; gap: 1.5rem; align-items: center; padding: .9rem 1.5rem; background: #1b1712; border-bottom: 1px solid #2c261e; }
        .navbar a { color: #ece3d2; text-decoration: none; font-weight: 600; }
        .navbar a:hover { color: #c79a4b; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        .mt-5 { margin-top: 2rem; }
        a { color: #c79a4b; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">Admin Panel</a>
        <a href="{{ url_for('index') }}">View site</a>
    </nav>
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
